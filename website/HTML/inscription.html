    <!-- Formulaire d'Inscription -->
    <section class="formulaire-section">
        <div class="forme-conteneur">
            <div class="formulaire-box">
                <h1>Créer un compte</h1>
                <p>Rejoignez CPasCher et profitez des meilleures offres</p>
                
                <form id="form-inscription" method="POST" action="../PHP/traiter-inscription.php">
                    <div class="groupe-formule">
                        <label for="prenom">Prénom :</label>
                        <input type="text" id="prenom" name="prenom" required placeholder="Votre prénom"/>
                    </div>
                    
                    <div class="groupe-formule">
                        <label for="nom">Nom :</label>
                        <input type="text" id="nom" name="nom" required placeholder="Votre nom"/>
                    </div>
                    
                    <div class="groupe-formule">
                        <label for="email-inscription">Adresse email :</label>
                        <input type="email" id="email-inscription" name="email" required placeholder="votre.email@exemple.com"/>
                    </div>
                    
                    <div class="groupe-formule">
                        <label for="mot_de_passe_inscription">Mot de passe :</label>
                        <div class="champ-motdepasse">
                            <input type="password" id="mot_de_passe_inscription" name="mot_de_passe" required placeholder="Au minimum 8 caractères" class="input-avec-icone"/>
                            <button type="button" onclick="const input = document.getElementById('mot_de_passe_inscription'); input.type = input.type === 'password' ? 'text' : 'password'; this.textContent = input.type === 'password' ? '🔐' : '🔓';" class="bouton-cache">🔐</button>
                        </div>
                    </div>
                    
                    <div class="groupe-formule">
                        <label for="confirmer_mdp">Confirmer le mot de passe :</label>
                        <div class="champ-motdepasse">
                            <input type="password" id="confirmer_mdp" name="confirmer_mdp" required placeholder="Confirmez votre mot de passe" class="input-avec-icone"/>
                            <button type="button" onclick="const input = document.getElementById('confirmer_mdp'); input.type = input.type === 'password' ? 'text' : 'password'; this.textContent = input.type === 'password' ? '🔐' : '🔓';" class="bouton-cache">🔐</button>
                        </div>
                    </div>
                    
                    <div class="groupe-formule">
                        <label for="adresse">Adresse de livraison :</label>
                        <input type="text" id="adresse" name="adresse" placeholder="Votre adresse complète"/>
                    </div>
                    
                    <div class="groupe-formule">
                        <label>
                            <input type="checkbox" name="conditions" required/> 
                            J'accepte les <a href="conditions-generales.html">conditions générales</a>
                        </label>
                    </div>
                    
                    <button type="submit" class="bouton bouton-primaire large">S'inscrire</button>
                </form>
                
                <div class="formulaire-liens">
                    <p>Déjà inscrit ? <a href="connexion.html">Se connecter</a></p>
                </div>
            </div>
        </div>
    </section>
